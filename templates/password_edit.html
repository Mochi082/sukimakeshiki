<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>すきまけしき － パスワード変更</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/settings.css">
</head>
<body>
  
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-area">
        {% for message in messages %}
          <div class="flash-message">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

<div id="settings-page" class="page active">

  <header class="settings-header">
    <a href="{{ url_for('settings') }}" class="back-btn"><i class="fa fa-chevron-left"></i></a>
    <div class="header-divider"></div>
    <span class="page-label">パスワード変更</span>
  </header>

  <div class="settings-content">
    <section class="settings-section">
      <div class="settings-card">
        <form method="POST" action="{{ url_for('password_edit') }}" novalidate>
          <div class="settings-row">
            <label class="settings-row-label">現在のパスワード</label>
            <div class="settings-row-right">
              <input class="settings-input" type="password" name="current_password" placeholder="••••••••" required>
            </div>
          </div>
          <div class="settings-divider"></div>
          <div class="settings-row">
            <label class="settings-row-label">新しいパスワード</label>
            <div class="settings-row-right">
              <input class="settings-input" type="password" name="new_password" placeholder="••••••••" minlength="8" required>
            </div>
          </div>
          <div class="settings-divider"></div>
          <div class="settings-row">
            <label class="settings-row-label">確認</label>
            <div class="settings-row-right">
              <input class="settings-input" type="password" name="new_password2" placeholder="••••••••" minlength="8" required>
            </div>
          </div>
          <div class="settings-divider"></div>
          <div class="settings-row settings-row-action">
            <button type="submit" class="settings-btn-primary">パスワードを変更</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>

<!-- <div class="settings-toast" id="settingsToast"></div> -->

<script src="/static/js/settings.js"></script>
</body>
</html>
